name: Redraw banner

on:
  schedule:
    - cron: "0 19 * * *"   # 00:30 IST
  workflow_dispatch:

concurrency:
  group: banner
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Draw with today's contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 katana/build.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add katana/banner.svg
          git diff --staged --quiet || git commit -m "banner: contributions for $(date -u +%F)"
          git pull --rebase
          git push
